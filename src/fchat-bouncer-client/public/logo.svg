<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pinkEarGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="magentaEarGradient" cx="70%" cy="30%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C71585;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C71585;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(199, 21, 133, 0.4)"/>
    </filter>
  </defs>
  
  <!-- Left fennec ear - tilted outward -->
  <path d="M 45 60 Q 30 25 50 15 Q 75 20 80 50 Q 85 65 75 70 Q 60 75 45 60 Z" 
        fill="url(#pinkEarGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Right fennec ear - tilted outward -->
  <path d="M 155 60 Q 140 75 125 70 Q 115 65 120 50 Q 125 20 150 15 Q 170 25 155 60 Z" 
        fill="url(#magentaEarGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Inner ear details with soft curves -->
  <ellipse cx="60" cy="45" rx="5" ry="12" 
           fill="#FFCCCB" 
           transform="rotate(-30 60 45)"
           opacity="0.8"/>
  
  <ellipse cx="140" cy="45" rx="5" ry="12" 
           fill="#FFCCCB" 
           transform="rotate(30 140 45)"
           opacity="0.8"/>
  
  <!-- Letter F with rounded corners for better ICO scaling -->
  <path d="M 65 80 Q 60 75 65 75 L 135 75 Q 140 75 140 80 Q 140 85 135 85 L 85 85 L 85 100 L 115 100 Q 120 100 120 105 Q 120 110 115 110 L 85 110 L 85 160 Q 85 165 80 165 L 70 165 Q 65 165 65 160 Z" 
        fill="url(#fGradient)" 
        filter="url(#glow)"/>
  
  <!-- Decorative elements for fancy appearance -->
  <circle cx="70" cy="85" r="2" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="75" cy="110" r="1.5" fill="#FFB6C1" opacity="0.4"/>
  <circle cx="132" cy="82" r="1" fill="#FF69B4" opacity="0.7"/>
  
  <!-- Subtle ear tip highlights -->
  <ellipse cx="50" cy="25" rx="3" ry="5" fill="#FFFFFF" opacity="0.3"/>
  <ellipse cx="150" cy="25" rx="3" ry="5" fill="#FFFFFF" opacity="0.3"/>
</svg>